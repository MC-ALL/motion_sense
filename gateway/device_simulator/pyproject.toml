[build-system]
requires = ["setuptools>=82.0.1", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-sense-gateway-device-simulator"
version = "1.0.0rc1"
description = "Async MQTT device simulator for the motion_sense gateway stack"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "aiomqtt==2.5.1",
  "pydantic==2.13.3",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
