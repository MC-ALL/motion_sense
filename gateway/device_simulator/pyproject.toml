[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-sense-gateway-device-simulator"
version = "0.1.0"
description = "Async MQTT device simulator for the motion_sense gateway stack"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "aiomqtt==2.4.0",
  "pydantic==2.11.4",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
