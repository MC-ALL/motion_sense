app_name: motion-sense-ops-observer-api-service
host: 0.0.0.0
port: 8090
log_level: INFO
poll_interval_s: 15
ws_snapshot_interval_s: 30
upstream_ws_ping_interval_s: 20
upstream_ws_retry_interval_s: 5
database_path: /runtime/data/ops_observer/ops_observer.sqlite3
alert_threshold:
  stale_after_s: 60
  emit_recovery_alert: true
auth:
  enforce_rest: false
  enforce_ws: false
  issuer: motion_sense_backend
  audience: motion_sense_api
  jwt:
    access_secret: null
upstream_modules:
  - module_id: gateway:gw-001
    module_type: gateway
    display_name: 网关 gw-001
    base_url: http://gateway-edge-processor:8080
    timeout_s: 5.0
    auth_username: null
    auth_password: null
    ws_enabled: true
    ws_path: /ops/ws
  - module_id: backend:api-main
    module_type: backend
    display_name: 后台 API
    base_url: http://backend-api-service:8000
    timeout_s: 5.0
    auth_username: null
    auth_password: null
    ws_enabled: true
    ws_path: /ops/ws
