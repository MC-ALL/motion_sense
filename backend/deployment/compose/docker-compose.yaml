services:
  timescaledb:
    build:
      context: ../../..
      dockerfile: backend/deployment/timescaledb/Dockerfile
    environment:
      POSTGRES_DB: motion_sense
      POSTGRES_USER: motion_sense
      POSTGRES_PASSWORD: change_me_at_deploy
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

  api_service:
    build:
      context: ../../..
      dockerfile: backend/deployment/api_service/Dockerfile
    depends_on:
      - timescaledb
    environment:
      BACKEND_STORAGE_BACKEND: postgres
      BACKEND_DATABASE_HOST: timescaledb
      BACKEND_DATABASE_PORT: 5432
      BACKEND_DATABASE_NAME: motion_sense
      BACKEND_DATABASE_USER: motion_sense
      BACKEND_DATABASE_PASSWORD: change_me_at_deploy
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./runtime/config:/runtime/config

volumes:
  timescaledb_data:
