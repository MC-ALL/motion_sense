app_name: motion-sense-backend-api-service
host: 0.0.0.0
port: 8000
log_level: INFO
storage_backend: memory
realtime_backend: local
ws_heartbeat_timeout_s: 45
cors_origins:
  - "*"
database:
  host: timescaledb
  port: 5432
  dbname: motion_sense
  user: motion_sense
  password: null
  min_pool_size: 1
  max_pool_size: 8
redis:
  host: redis
  port: 6379
  db: 0
  channel: motion_sense:realtime_events
device_command:
  topic_prefix: gym
  default_qos: 1
  default_retain: false
  pending_fetch_limit: 100
