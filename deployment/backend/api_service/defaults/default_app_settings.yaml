app_name: motion-sense-backend-api-service
host: 0.0.0.0
port: 8000
log_level: INFO
storage_backend: memory
realtime_backend: local
realtime_telemetry_flush_interval_ms: 500
ws_heartbeat_timeout_s: 45
cors_origins:
  - "*"
database:
  host: timescaledb
  port: 5432
  dbname: motion_sense
  user: motion_sense
  password: null
  min_pool_size: 1
  max_pool_size: 8
redis:
  host: redis
  port: 6379
  db: 0
  channel: motion_sense:realtime_events
device_command:
  topic_prefix: gym
  default_qos: 1
  default_retain: false
  pending_fetch_limit: 100
  max_attempts: 3
  retry_backoff_s: 5
  delivery_lease_s: 15
  expire_after_s: 300
auth:
  enforce_rest: true
  enforce_ws: true
  issuer: motion_sense_backend
  audience: motion_sense_api
  access_token_ttl_s: 900
  refresh_token_ttl_s: 604800
  admin:
    username: admin
    password_hash: __GENERATE_PASSWORD_HASH__
  jwt:
    access_secret: __GENERATE_ACCESS_SECRET__
    refresh_secret: __GENERATE_REFRESH_SECRET__
ai:
  auto_process: true
  poll_interval_s: 5
  batch_size: 4
  wakeup_backend: local
  wakeup_channel: motion_sense:ai_report_wakeup
  provider: builtin
  base_url: https://api.deepseek.com/v1
  model_variant: reasoner
  model: null
  api_key: null
  request_timeout_s: 60
  max_tokens: 4096
