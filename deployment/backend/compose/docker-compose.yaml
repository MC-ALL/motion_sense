services:
  backend_timescaledb:
    build:
      context: ../../..
      dockerfile: deployment/backend/timescaledb/Dockerfile
    environment:
      POSTGRES_DB: motion_sense
      POSTGRES_USER: motion_sense
      POSTGRES_PASSWORD: ${BACKEND_DATABASE_PASSWORD:-change_me_at_deploy}
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motion_sense -d motion_sense >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend_redis:
    image: redis:8.6-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend_api_service:
    build:
      context: ../../..
      dockerfile: deployment/backend/api_service/Dockerfile
    depends_on:
      backend_timescaledb:
        condition: service_healthy
      backend_redis:
        condition: service_healthy
    environment:
      BACKEND_STORAGE_BACKEND: postgres
      BACKEND_REALTIME_BACKEND: redis
      BACKEND_AI_WAKEUP_BACKEND: redis
      BACKEND_DATABASE_HOST: backend_timescaledb
      BACKEND_DATABASE_PORT: 5432
      BACKEND_DATABASE_NAME: motion_sense
      BACKEND_DATABASE_USER: motion_sense
      BACKEND_DATABASE_PASSWORD: ${BACKEND_DATABASE_PASSWORD:-change_me_at_deploy}
      BACKEND_REDIS_HOST: backend_redis
      BACKEND_REDIS_PORT: 6379
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ../../runtime/config:/runtime/config
      - ../../runtime/secrets:/runtime/secrets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  timescaledb_data:
