services:
  web_portal_app:
    build:
      context: ../../..
      dockerfile: deployment/web/portal_app/Dockerfile
    environment:
      WEB_PORTAL_BACKEND_BASE_URL: ${WEB_PORTAL_BACKEND_BASE_URL:-}
      WEB_PORTAL_BACKEND_WS_URL: ${WEB_PORTAL_BACKEND_WS_URL:-/api/ws}
      WEB_PORTAL_OPS_BASE_URL: ${WEB_PORTAL_OPS_BASE_URL:-}
      WEB_PORTAL_OPS_WS_URL: ${WEB_PORTAL_OPS_WS_URL:-/api/ws/ops}
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - ../../runtime/config:/runtime/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
